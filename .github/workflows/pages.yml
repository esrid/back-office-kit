# Publie la galerie sur GitHub Pages.
#
# Le workflow ne construit rien : dist/ est versionné, donc il met en ligne le
# fichier déjà commité. C'est volontaire — un `make gallery` oublié se voit
# alors sur le site plutôt que de rester invisible dans un diff.
#
# La source Pages du dépôt doit être « GitHub Actions », pas une branche :
# /dist n'est pas un dossier accepté par la publication depuis une branche.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - dist/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, et on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages sert index.html à la racine, la galerie porte un autre nom.
      # llms.txt vit à la racine du dépôt et se sert à la racine du site : la
      # convention veut qu'un agent le trouve à /llms.txt, pas ailleurs.
      - run: |
          cp dist/gallery.html dist/index.html
          cp llms.txt dist/llms.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
